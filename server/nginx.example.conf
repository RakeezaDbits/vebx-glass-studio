# Copy the relevant parts into your site under /etc/nginx/sites-available/
# Node API must listen on 127.0.0.1:3001 (see server/.env PORT=3001).
#
# CRITICAL: proxy_pass must NOT end with a slash if you use "location /api/".
# Wrong:  proxy_pass http://127.0.0.1:3001/;
#          → Nginx strips /api and sends /livechat/session to Node.
#          Express expects /api/livechat/session → 404 "Chat API not found".
# Right:  proxy_pass http://127.0.0.1:3001;
#          → Full path /api/... is forwarded unchanged.

server {
    listen 443 ssl http2;
    server_name vebxrun.com www.vebxrun.com;

    # root ... path to Vite build output (dist/)
    root /var/www/vebx-glass-studio/dist;
    index index.html;

    # 1) API first — before any SPA fallback
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # 2) Static files + SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
